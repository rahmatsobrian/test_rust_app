[package]
name = "hello_rust_android"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
# cdylib dibutuhkan Android, lib dibutuhkan untuk build desktop
crate-type = ["cdylib", "lib"]

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
  "default_fonts",
  "glow",
  "android-native-activity",
] }
log = "0.4"

# Hanya untuk build desktop (uji lokal)
[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["x11", "wayland"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
winit = { version = "0.30", features = ["android-native-activity"] }

[package.metadata.android]
package = "com.rahmat.hellorust"
build_targets = ["aarch64-linux-android"]
apk_name = "HelloRust"

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 34

[package.metadata.android.application]
label = "Hello Rust"

# Signing untuk build release. Keystore dibuat otomatis oleh workflow CI.
# Untuk rilis sungguhan (Play Store), ganti dengan keystore milik Anda sendiri.
[package.metadata.android.signing.release]
path = "$HOME/.android/ci-release.keystore"
keystore_password = "android"
